name: Prepare original competition badges for PES 2017 (personal use)

on:
  pull_request:
    branches: [feature/competition-logos-20261121]
    paths:
      - .github/workflows/prepare-lote07-sources.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-and-convert:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'feature/lote07-official-assets-20261121'
    runs-on: ubuntu-latest
    steps:
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Fetch real logos, optimize, verify and package PNG (no CPK access)
        shell: bash
        run: |
          cat >/tmp/convert.py <<'PY'
          import io,urllib.request,hashlib,base64,json
          from pathlib import Path
          from PIL import Image
          cfg=[
              ('coppa_italia','https://images.seeklogo.com/logo-png/54/1/coppa-italia-logo-png_seeklogo-547524.png',14336),
              ('coupe_de_france','https://assets-eu-01.kc-usercontent.com/00700616-e4fb-015d-9378-ef41bc76ccc9/6d5174ac-29d2-47c9-a3ba-d0c7faaad120/Coupe_de_France_logo.png',26624),
              ('taca_de_portugal','https://cdn-img.zerozero.pt/img/logos/edicoes/188527_imgbank_.png',11264)
          ]
          out=Path('lote07-private-assets')
          out.mkdir(exist_ok=True)
          manifest=[]
          for name,url,cap in cfg:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'image/png,image/*;q=0.8'})
              with urllib.request.urlopen(req,timeout=35) as response:data=response.read(3000001)
              if not data.startswith(b'\x89PNG\r\n\x1a\n') or len(data)>3000000:
                  raise ValueError('Expected PNG source failed for '+name)
              img=Image.open(io.BytesIO(data));img.load()
              if img.width<250 or img.height<250:raise ValueError('Unexpected low-quality logo: '+name)
              rgba=img.convert('RGBA')
              alpha=rgba.getchannel('A')
              bb=alpha.getbbox()
              if not bb:raise ValueError('Source blank '+name)
              cropped=rgba.crop(bb)
              cropped.thumbnail((226,226),Image.Resampling.LANCZOS)
              canvas=Image.new('RGBA',(256,256),'white')
              canvas.alpha_composite(cropped,((256-cropped.width)//2,(256-cropped.height)//2))
              candidates=[]
              for ncolors in [256,128,64,32,16]:
                  im=canvas.quantize(colors=ncolors,method=Image.Quantize.FASTOCTREE,dither=Image.Dither.NONE)
                  b=io.BytesIO();im.save(b,'PNG',optimize=True,compress_level=9)
                  if len(b.getvalue())<=cap:
                      candidates.append((ncolors,b.getvalue()))
              if not candidates:
                  raise ValueError('No indexed PNG fits for '+name)
              colors,png=candidates[0]
              dest=out/(name+'.png');dest.write_bytes(png)
              Image.open(dest).verify()
              rec={'competition':name,'source_url':url,'source_sha256':hashlib.sha256(data).hexdigest(),
                   'output_png_sha256':hashlib.sha256(png).hexdigest(),'output_png_bytes':len(png),
                   'colors':colors,'max_slot':cap}
              manifest.append(rec)
              print('BEGIN_BADGE_'+name)
              print(base64.b64encode(png).decode('ascii'))
              print('END_BADGE_'+name)
              print('CHECK_'+name+' '+json.dumps(rec))
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
          python /tmp/convert.py
      - name: Retain badge inputs outside the Git commit history for 7 days
        uses: actions/upload-artifact@v4
        with:
          name: PES2017-Lote07-original-badges
          path: lote07-private-assets/
          retention-days: 7
