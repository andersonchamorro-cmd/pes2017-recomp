name: Prepare PES 2017 Serie B 22 crest inputs

on:
  push:
    branches: [feature/club-names-logos-pilot]
    paths: [.github/workflows/fetch-serieb-crests.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-crests:
    runs-on: ubuntu-latest
    steps:
      - name: Install image utilities
        run: python -m pip install --disable-pip-version-check cairosvg pillow
      - name: Download and convert 22 team crests
        shell: bash
        run: |
          cat >/tmp/prepare.py <<'PY'
          from pathlib import Path
          import urllib.request,urllib.parse,io,csv
          import cairosvg
          from PIL import Image
          names={
          317:'Ascoli.svg',
          4141:'US_Avellino_1912.svg',
          319:'Bari.svg',
          4232:'Benevento.svg',
          187:'Brescia.svg',
          4075:'AC_Carpi.svg',
          1362:'Cesena_FC.svg',
          1920:'Cittadella.svg',
          4234:'Frosinone_Calcio.svg',
          4076:'Latina_Calcio_1932.svg',
          2377:'Novara.svg',
          4240:'Perugia.svg',
          4241:'Pisa.svg',
          2612:'FC_Pro_Vercelli_1892.svg',
          4244:'Salernitana.svg',
          4923:'SPAL.svg',
          1600:'Spezia.svg',
          331:'Ternana.svg',
          4077:'Trapani.svg',
          336:'Hellas_Verona.svg',
          337:'Vicenza.svg',
          4230:'Virtus_Entella.svg'}
          assert len(names)==22
          p=Path('serieb-crests');p.mkdir(exist_ok=True)
          with (p/'manifest.csv').open('w',newline='',encoding='utf-8') as file:
            writer=csv.writer(file)
            writer.writerow(['team_id','SVG_file','SVG_url','PNG_file'])
            for tid,name in names.items():
              url='https://raw.githubusercontent.com/JoseArroyave/football-logos/main/logos/italy/'+urllib.parse.quote(name)
              req=urllib.request.Request(url,headers={'User-Agent':'PES2017-Private-Mod-Asset-Pipeline/1.0'})
              with urllib.request.urlopen(req,timeout=35) as resp: data=resp.read()
              if b'<svg' not in data[:8192]:raise ValueError('Not SVG '+name)
              img=Image.open(io.BytesIO(cairosvg.svg2png(bytestring=data,output_width=480,output_height=480))).convert('RGBA')
              bb=img.getchannel('A').getbbox()
              if not bb:raise ValueError('Blank logo '+name)
              img=img.crop(bb);img.thumbnail((468,468),Image.Resampling.LANCZOS)
              canvas=Image.new('RGBA',(512,512),(0,0,0,0))
              canvas.alpha_composite(img,((512-img.width)//2,(512-img.height)//2))
              png=f'{tid:04d}.png';canvas.save(p/png,optimize=True)
              writer.writerow([tid,name,url,png])
              print(tid,name)
          assert len(list(p.glob('*.png')))==22
          PY
          python /tmp/prepare.py
      - name: Upload temporary images for local conversion and manual QA
        uses: actions/upload-artifact@v4
        with:
          name: PES2017-SerieB-22-Crest-Inputs
          path: serieb-crests/
          retention-days: 7
