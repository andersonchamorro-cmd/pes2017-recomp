name: Build PES 2017 Xbox Player 1 test APK

on:
  push:
    branches:
      - fix/xbox-player1-external-gamepads
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out corrected sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate the Android SDK preinstalled on the runner
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK not present on runner}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Using SDK manager: $SDKMANAGER"

      - name: Install Android build dependencies
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Download and verify official PES 2017 0.2.0 port APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/dzakyraf/pes2017-recomp/releases/download/0.2.0/pes2017-recomp-0.2.0.apk" \
            --output "$RUNNER_TEMP/pes2017-original.apk"
          echo "843e276c2f86adc6057c0ed5288ab64110195342ac6bbeec1e6ce663b83ce1d6  $RUNNER_TEMP/pes2017-original.apk" | sha256sum --check

      - name: Reuse exact native libraries from the official APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk-extracted" "$RUNNER_TEMP/prebuilt/arm64-v8a"
          unzip -q "$RUNNER_TEMP/pes2017-original.apk" 'lib/arm64-v8a/*' -d "$RUNNER_TEMP/apk-extracted"
          find "$RUNNER_TEMP/apk-extracted/lib/arm64-v8a" -maxdepth 1 -name '*.so' -exec cp {} "$RUNNER_TEMP/prebuilt/arm64-v8a/" \;
          test -f "$RUNNER_TEMP/prebuilt/arm64-v8a/libpes17.so"
          ls -lh "$RUNNER_TEMP/prebuilt/arm64-v8a"

      - name: Build corrected Android APK (signed with test/debug key)
        working-directory: android
        shell: bash
        env:
          PES17_VERSION_CODE: '41'
          PES17_VERSION_NAME: '0.2.0-xbox-player1-test'
          PES17_BUILD_SHA: ${{ github.sha }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PprebuiltNative="$RUNNER_TEMP/prebuilt" --no-daemon --stacktrace

      - name: Upload APK for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: PES2017-Xbox-Jugador1-PRUEBA
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
