name: Prepare PES 2017 Serie A missing crest images

on:
  push:
    branches: [feature/club-names-logos-pilot]
    paths: [.github/workflows/fetch-seriea-logos.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-two-logos:
    runs-on: ubuntu-latest
    steps:
      - name: Install PNG renderer
        run: python -m pip install --disable-pip-version-check cairosvg pillow
      - name: Fetch Juventus and Sassuolo SVG and render transparent PNG
        shell: bash
        run: |
          cat > /tmp/convert.py <<'PY'
          from pathlib import Path
          from PIL import Image
          import cairosvg,urllib.request,io
          names={120:"Juventus.svg",1919:"Sassuolo.svg"}
          base="https://raw.githubusercontent.com/JoseArroyave/football-logos/main/logos/italy/"
          dest=Path("seriea-crests");dest.mkdir(exist_ok=True)
          lines=["PES2017_ID,Source_File,Source_URL,PNG_File"]
          for tid,filename in names.items():
            url=base+filename
            req=urllib.request.Request(url,headers={"User-Agent":"PES2017-Crest-Mod/1.0"})
            with urllib.request.urlopen(req,timeout=30) as stream:svg=stream.read()
            if b"<svg" not in svg[:8192]:raise ValueError(filename+" not SVG")
            png=cairosvg.svg2png(bytestring=svg,output_width=460,output_height=460)
            img=Image.open(io.BytesIO(png)).convert("RGBA")
            bbox=img.getchannel("A").getbbox()
            if not bbox:raise ValueError("blank image")
            img=img.crop(bbox)
            img.thumbnail((468,468),Image.Resampling.LANCZOS)
            canvas=Image.new("RGBA",(512,512),(0,0,0,0))
            canvas.alpha_composite(img,((512-img.width)//2,(512-img.height)//2))
            canvas.save(dest/f"{tid:04d}.png",optimize=True)
            lines.append(f"{tid},{filename},{url},{tid:04d}.png")
          (dest/"manifest.csv").write_text("\n".join(lines)+"\n",encoding="utf-8")
          assert len(list(dest.glob("*.png")))==2
          PY
          python /tmp/convert.py
      - name: Export two logo images for local patch
        uses: actions/upload-artifact@v4
        with:
          name: PES2017-SerieA-2-Crests-Input
          path: seriea-crests/
          retention-days: 7
